name: live-catalogues

# The data path talks to public services (Planetary Computer, CDSE STAC, the Sen1Floods11
# bucket, the CEMS rapid-mapping API) whose schemas drift. This weekly run catches the drift
# before a user does; it needs no credentials.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Live catalogue and archive tests
        run: uv run --no-sync pytest -m network -v
