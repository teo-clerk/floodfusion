name: pages

# Publishes the interactive explainer (site/, with every number read from reports/) to GitHub Pages.
# It runs on the public repository only, after Pages is enabled with "GitHub Actions" as its source.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "reports/**"
      - "assets/**"
      - "scripts/build_site.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - name: Build the site from the committed reports
        # Only NumPy and Pillow are needed, at uv.lock's versions for Python 3.12; the full environment is not.
        run: uv run --no-project --with numpy==2.5.3 --with pillow==12.3.0 python scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
